<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Slate Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Metallic Brushed Aluminum Gradient -->
    <linearGradient id="alumGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Precision Cinnabar Red Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Sapphire Blue Precision Glow -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Inner Bevel Stroke -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)" />
      <stop offset="50%" stop-color="rgba(148,163,184,0.15)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0.8)" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="rgba(0,0,0,0.55)" />
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" filter="url(#shadowFilter)" />
  <rect x="25" y="25" width="462" height="462" rx="111" ry="111" fill="none" stroke="url(#strokeGrad)" stroke-width="3" />

  <!-- Subtle Precision CNC Hexagonal Grid / Tooling Guideline -->
  <path d="M 256,64 L 420,160 L 420,352 L 256,448 L 92,352 L 92,160 Z" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Stylized Industrial "F" Monogram (Precision Chamfered Metallurgy) -->
  <g filter="url(#shadowFilter)">
    <!-- Main Vertical Column (7075-T651 Billet) -->
    <path d="M 148,128 
             L 216,128 
             L 216,384 
             L 148,384 
             Z" 
          fill="url(#alumGrad)" />
    
    <!-- Top Horizontal Beam (Precision Chamfered 45deg) -->
    <path d="M 216,128 
             L 364,128 
             L 334,188 
             L 216,188 
             Z" 
          fill="url(#alumGrad)" />

    <!-- 3D Depth Highlight on Top Beam -->
    <path d="M 216,128 L 364,128 L 354,142 L 216,142 Z" fill="#ffffff" opacity="0.6" />

    <!-- Middle Crossbeam (Dynamic Anodized Cinnabar Red Bar) -->
    <path d="M 216,232 
             L 326,232 
             L 302,284 
             L 216,284 
             Z" 
          fill="url(#accentGrad)" />
    
    <!-- Laser Cut Precision Notch / Kerf Indicator -->
    <polygon points="326,232 342,232 318,284 302,284" fill="url(#blueGrad)" opacity="0.9" />

    <!-- Bottom Anchor Foot / Spec Tolerance Chamfer -->
    <polygon points="148,348 216,348 216,384 148,384" fill="#475569" opacity="0.4" />
    <line x1="148" y1="384" x2="216" y2="384" stroke="url(#blueGrad)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Spark of Precision (Upper Right Diamond) -->
  <polygon points="378,102 388,118 404,128 388,138 378,154 368,138 352,128 368,118" fill="#38bdf8" opacity="0.9" filter="url(#glowFilter)" />
</svg>

